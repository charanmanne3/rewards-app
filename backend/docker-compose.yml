services:
  db:
    image: postgres:16-alpine
    container_name: rewards_postgres
    environment:
      POSTGRES_USER: rewards_user
      POSTGRES_PASSWORD: rewards_pass
      POSTGRES_DB: rewards_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewards_user -d rewards_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: rewards_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rewards_user:rewards_pass@db:5432/rewards_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
