# Use render.yaml at repository root (../render.yaml) for Blueprint deploys.
# This file documents the native Python service when Root Directory = backend.

# Render Dashboard (Root Directory: backend, Environment: Python 3):
#   Build Command:  pip install -r requirements.txt
#   Start Command:  uvicorn app.main:app --host 0.0.0.0 --port $PORT
#
# runtime.txt must live at REPOSITORY ROOT (../runtime.txt), not in backend/.
#
# If using Docker instead, use Dockerfile (Python 3.11.9) — runtime.txt is ignored.
