# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect repo and set root directory to `backend` or use this blueprint from repo root.

services:
  - type: web
    name: rewards-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health/ready
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: WEB_CONCURRENCY
        value: "1"
      - key: EXPIRATION_JOB_ENABLED
        value: "true"
      - key: OFFER_REFRESH_JOB_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rewards-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: rewards-api.onrender.com

databases:
  - name: rewards-db
    plan: free
    databaseName: rewards
    user: rewards
