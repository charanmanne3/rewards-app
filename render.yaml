# Deploy from repository root. Service code lives in backend/ (rootDir).
# runtime.txt at repo root forces Python 3.11.9 for native Python services.

services:
  - type: web
    name: rewards-api
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rewards-db
          property: connectionString

databases:
  - name: rewards-db
    plan: free
    databaseName: rewards
    user: rewards
